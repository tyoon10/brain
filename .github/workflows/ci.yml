name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

# Production deploy is omitted on purpose.
# Do not publish this preview until an explicit cutover is asked for.
# Unattended rebuild + outbound-link checks live in preview-unattended.yml
# and never deploy.
