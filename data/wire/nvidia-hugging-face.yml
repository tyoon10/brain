title: NVIDIA signs agreement to acquire Hugging Face
publishedAt: 2026-09-03
summary: NVIDIA announced a definitive agreement to acquire Hugging Face. The 2
  September 8-K describes about $11.9 billion to stockholders plus up to about
  $1.0 billion in retention, a structure of about $12.93 billion. Signed, not
  closed; expected close in the first half of 2027, subject to regulatory
  approval.
